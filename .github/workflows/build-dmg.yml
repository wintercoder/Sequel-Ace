name: Build DMG

on:
  push:
    branches: [support-import-password]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package macOS app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the requested branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Record build environment
        run: |
          xcodebuild -version
          sw_vers
          git rev-parse HEAD

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test \
            -project sequel-ace.xcodeproj \
            -scheme 'Unit Tests' \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/tests.log

      - name: Archive and create DMG
        shell: bash
        run: bash Scripts/build-dmg.sh

      - name: Upload DMG and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sequel-Ace-DMG-${{ github.sha }}
          path: |
            build/dmg/*.dmg
            build/dmg/*.sha256
            build/dmg/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sequel-Ace-build-diagnostics-${{ github.run_id }}
          path: |
            build/*.log
            build/UnitTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
